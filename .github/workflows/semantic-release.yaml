name: Release Build Logic

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    name: Release Build Logic
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release
        run: |
          # Get current version before release
          CURRENT_VERSION=$(./gradlew currentVersion -q --console=plain)
          echo "Current version: $CURRENT_VERSION"
          
          # Create release (this creates the git tag automatically)
          ./gradlew release -Prelease.version${{ github.event.inputs.increment }} -Prelease.pushTagsOnly
          
          # Get new version after release
          NEW_VERSION=$(./gradlew currentVersion -q --console=plain)
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "New version: $NEW_VERSION"

      - name: Update Changelog
        run: ./gradlew patchChangelog

      - name: Commit Changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $NEW_VERSION [skip ci]" || echo "No changelog changes"
          git push

      - name: Publish Packages
        run: |
          ./gradlew :conventions:publishToMavenCentral :version-catalog:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG=$(./gradlew getChangelog --unreleased --no-header --console=plain -q)
          gh release create "build-logic-$NEW_VERSION" \
            --title "Build Logic $NEW_VERSION" \
            --notes "$CHANGELOG"
